# Opt-in rules for Adaptive Enchantment [C18] [2018]. No upstream scripts or decks changed.
# Creeping Renaissance: recover the most numerous permanent type; cast at four or more.
# Dawn's Reflection / Fertile Ground: own basic land first, otherwise any legal own land.
# Wild Growth: any legal own land. Equal choices use battlefield order, without extra RNG.
# Estrid, the Masked (quoted: comma in name): in our second main only, Mask our best unmasked
# creature at three or more loyalty when nothing enchanted needs untapping; otherwise +2.
ignoreRemoveDeckDuringPlay=Creeping Renaissance,Dawn's Reflection,Fertile Ground,Wild Growth
aiLogic=Creeping Renaissance=CreepingRenaissance,Dawn's Reflection=ManaAuraBasicFirst,Fertile Ground=ManaAuraBasicFirst,Wild Growth=ManaAuraAnyLand,"Estrid, the Masked=Estrid"
deckDir=res/quest/commanderprecons
decks=Adaptive Enchantment [C18] [2018].dck,Adaptive Enchantment [C18] [2018].dck

# Audited mechanic: unconditional TapsForMana bonuses of one/two fixed, chosen, or flexible mana.
# Recognition is structural; no additional named-card aiLogic or script edits are needed.
# Granted mana abilities already use the native planner. Variable, restricted, and replacement
# production stays outside this family extension.
landManaAuras=true
