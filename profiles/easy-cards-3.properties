# The Prismatic Piper: native play only (the other tag only affects deck generation).
# Cave of Temptation: counters on our best creature with 8+ lands in play and no land in hand, at sorcery speed.
# Throes of Chaos: cast in our first main; retrace only with 6+ lands and a land to discard.
# Masterful Replication: end step of an opponent's turn, always the two Golems.
# Call for Aid: only when borrowed creatures plus ours are lethal on a different opponent.
# Marauding Raptor: native play; while it is in play, small non-Dinosaur creatures are held.
# God-Eternal Bontu: sacrifice tokens then lands beyond the seventh (at most three) and draw; always keep the death trigger.
# Esix, Fractal Bloom: copy our best nonlegendary creature instead of making tokens.
ignoreRemoveDeckDuringPlay=The Prismatic Piper,Cave of Temptation,Throes of Chaos,Masterful Replication,Call for Aid,Marauding Raptor,God-Eternal Bontu,"Esix, Fractal Bloom"
