# Opt-in rules for five single-blocker cards. Original scripts, decks and default AI unchanged.
# Syr Elenora, the Discerning: native play only (no special rule).
# Marsh Flitter: sacrifice a Goblin token once per turn only when a 3/3 changes this combat.
# Recurring Insight: target the opponent with most cards; hand cast needs 3+, rebound 1+; library > X+5.
# Pact of the Serpent: ourselves only, our most common creature type; X >= 2, stay at 10+ life, library > X+3.
# Suffer the Past: opponents only; lethal any time, otherwise X >= 3 at the end step before our turn.
ignoreRemoveDeckDuringPlay="Syr Elenora, the Discerning",Marsh Flitter,Recurring Insight,Pact of the Serpent,Suffer the Past
aiLogic=Marsh Flitter=MarshFlitter,Recurring Insight=RecurringInsight,Pact of the Serpent=PactOfTheSerpent,Suffer the Past=SufferThePast
