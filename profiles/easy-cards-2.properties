# Autumn Willow: native cast, never pays to lose shroud.
# Edge of Autumn: cast with 4 or fewer lands and a basic in the library; never cycled.
# Knollspine Dragon: cast in our second main; its trigger draws only if damage dealt beats our hand.
# Bosh, Iron Golem: sacrifice the cheapest nonland nontoken artifact (MV 3+) that kills the best creature or an opponent.
# Ashling the Pilgrim: grow twice a turn; the third (sweep) activation only to kill an opponent while we survive.
# Benevolent Offering: second main, choosing the opponent with the fewest creatures, when we have 2+ more creatures.
# Peel from Reality: bounce our enter-trigger or afflicted creature and the opponent's best creature if it is worth more.
