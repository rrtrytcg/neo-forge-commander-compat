# Opt-in utility abilities for four single-blocker lands. Original scripts, decks and default AI unchanged.
# Labyrinth of Skophos: opponent's turn after blocks; remove the biggest unblocked attacker hitting us
#   (power 4+ or lethal unblocked damage), with four other untapped lands.
# HELIOS One: energy at the end step of the player right before us, with one other untapped land.
# Crucible of the Spirit Dragon is deferred: native AI payment cannot spend storage-counter mana.
# HELIOS One: our main phase, destroy the best opposing nonland permanent with 3 <= MV <= energy,
#   keeping five other lands.
# Thespian's Stage: once, our second main, copy a basic land of our scarcest commander colour.
# Dakmor Salvage: dredge only with no land in hand, fewer than seven lands and 20+ library cards.
ignoreRemoveDeckDuringPlay=Labyrinth of Skophos,HELIOS One,Thespian's Stage,Dakmor Salvage
aiLogic=Labyrinth of Skophos=Labyrinth,HELIOS One=Helios,Thespian's Stage=Stage,Dakmor Salvage=Dakmor
