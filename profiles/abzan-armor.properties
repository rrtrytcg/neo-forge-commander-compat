# NeoForge AI override profile: abzan-armor
#
# Selected at runtime with  --ai-profile=abzan-armor  (sim) or
#   -Dneoforge.aiProfile=abzan-armor  (any launch, incl. the GUI).
#
# This file only OPTS IN to behaviour changes. Upstream Forge card scripts, the preset decks and the
# default AI are left completely untouched: with no profile selected, nothing here applies.
#
# ignoreRemoveDeckDuringPlay: cards whose `AI:RemoveDeck:All` script hint should not remove them from
# the AI's in-game play list (deck-building still honours the hint). Cards not listed behave as before.
ignoreRemoveDeckDuringPlay=Tower Defense,Slaughter the Strong,Wall of Limbs,Beast Within,Psychosis Crawler

# aiLogic: force an AILogic for a card without editing its script (<card>=<logic>, comma-separated).
# SlaughterTheStrong teaches the ChooseCard AI when to cast (Rule 1) and what to keep (Rule 2).
# WallOfLimbs teaches the LoseLife AI to drain for 6+ or whenever the drain is lethal.
# BeastWithin teaches the Destroy AI the requested target priorities.
aiLogic=Slaughter the Strong=SlaughterTheStrong,Wall of Limbs=WallOfLimbs,Beast Within=BeastWithin

# hybridFilterMana: cards whose "{X/Y}, {T}: Add ..." filter ability the default AI cannot pay for,
# because it only knows how to pay a *generic* mana cost on a mana ability. This is the whole
# Shadowmoor/Eventide filter land cycle; the land otherwise only ever produces {C}.
hybridFilterMana=Cascade Bluffs,Fetid Heath,Fire-Lit Thicket,Flooded Grove,Graven Cairns,Mystic Gate,Rugged Prairie,Sunken Ruins,Twilight Mire,Wooded Bastion

